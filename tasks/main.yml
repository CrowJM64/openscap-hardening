    path: /root/scap-security-guide-0.1.82.tar.gz
    state: absent

- name: OpenSCAP Evaluation Report Cleanup
  ansible.builtin.file:
    path: /root/openscap_hardening_results.xml
    state: absent

- name: OpenSCAP Report Lockdown
  ansible.builtin.file:
    path: "{{ report_location }}"
    mode: '0400'