## Generate Needed Changes - All Distros
- name: Generate Needed Changes Report
  ansible.builtin.shell:
    cmd: oscap xccdf generate report --output "{{ report_location }}" /root/openscap_hardening_results.xml
  when: 
    - ansible_facts['os_family'] in ["RedHat", "Debian"]
    - openscap_evaluated is succeeded
  register: openscap_evaluated
  changed_when: false


