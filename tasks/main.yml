---
# RHEL OpenSCAP Hardening
## Pre-req installation tasks
- name: Show OS information
  ansible.builtin.debug:
    msg: "OS: {{ ansible_os_family }} {{ ansible_distribution }} {{ ansible_distribution_major_version }}"

- name: Installing OpenSCAP, Security Guides and Lynx (RedHat)
  ansible.builtin.package:
    name:
      - openscap-scanner
      - scap-security-guide
      - lynx
    state: latest
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['distribution'] == "Amazon"
  register: openscap_installed

- name: Installing OpenSCAP, Security Guides and Lynx (Debian13+Ubuntu26)
  ansible.builtin.package:
    name:
      - libopenscap33
      - openscap-scanner
      - lynx
    state: latest
    update_cache: true
    cache_valid_time: 3600
  when:
    - (ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_major_version'] == "13") or (ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_major_version'] == "26")
  register: openscap_installed

- name: Installing OpenSCAP, Security Guides and Lynx (Debian12+Ubuntu24)
  ansible.builtin.package:
    name:
      - libopenscap25
      - openscap-scanner
      - lynx
    state: latest
    update_cache: true
    cache_valid_time: 3600
  when:
   - (ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_major_version'] == "12") or (ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_major_version'] == "24")
  register: openscap_installed

## Redhat OpenScap Evaluation
- name: Evaluate OpenSCAP Changes (RL10)
  ansible.builtin.shell:
    cmd: oscap xccdf eval --profile "{{ cis_benchmark }}" --results /root/openscap_hardening_results.xml /usr/share/xml/scap/ssg/content/ssg-rl10-ds.xml
    executable: /bin/bash
  when: 
    - ansible_facts['distribution'] == "Rocky" and ansible_facts['distribution_major_version'] == "10"
    - openscap_installed is succeeded
  register: openscap_evaluated
  changed_when: false
  failed_when:
    - openscap_evaluated.rc != 0
    - openscap_evaluated.rc != 2

