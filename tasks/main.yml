## Debian OpenSCAP Hardening
- name: Check if SSG Guides folder exists (Debian)
  stat:
    path: /usr/share/xml/scap/ssg/content/
  register: ssg_guide_info
  when: 
    - ansible_facts['os_family'] == "Debian"

- name: Create SSG Guides folder (Debian)
  ansible.builtin.file:
    path: /usr/share/xml/scap/ssg/content/
    state: directory
    mode: '0755'
  when: 
    - ansible_facts['os_family'] == "Debian"
    - not ssg_guide_info.stat.exists

- name: Download SCAP Security Guides (Debian)
  ansible.builtin.get_url:
    url: https://github.com/ComplianceAsCode/content/releases/download/v0.1.82/scap-security-guide-0.1.82.tar.gz
    dest: /root/scap-security-guide-0.1.82.tar.gz
    mode: '0500'
  when: 
    - ansible_facts['os_family'] == "Debian"

- name: Extract security guides
  ansible.builtin.unarchive:
    src: /root/scap-security-guide-0.1.82.tar.gz
    dest: /usr/share/xml/scap/ssg/content/
    remote_src: true
  when: 
    - ansible_facts['os_family'] == "Debian"
    - not ssg_guide_info.stat.exists

- name: Evaluate OpenSCAP Changes (Debian13)
  ansible.builtin.shell:
    cmd: oscap xccdf eval --profile "{{ debian_cis_benchmark }}" --results /root/openscap_hardening_results.xml /usr/share/xml/scap/ssg/content/scap-security-guide-0.1.82/ssg-debian13-ds.xml
  when: 
    - ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_major_version'] == "13"
    - openscap_installed is succeeded
