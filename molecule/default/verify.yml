---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    cis_benchmark: xccdf_org.ssgproject.content_profile_cis # Default CIS Server Level 2 (xccdf_org.ssgproject.content_profile_cis)
    oracle_cis_benchmark: xccdf_org.ssgproject.content_profile_anssi_bp28_intermediary # Default ANSSI-BP-028 Intermediate Level hardening
    amazon_cis_benchmark: xccdf_org.ssgproject.content_profile_standard # Standard System Security Profile for Amazon Linux
    report_location: /root/openscap_report.html # Location of final Hardening report. Openable with Lynx.

  tasks:
  - name: Check OpenScap resport exists and is locked down.
    ansible.builtin.stat:
      path: '/root/openscap_report.html'
    register: openscap_report
    failed_when: openscap_report.stat.mode != "0400"